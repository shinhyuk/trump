name: Daily update

on:
  schedule:
    # 매일 한국시간 08:17 (UTC 23:17) — 미국 장 마감 후 시세 반영
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "알림 테스트 (최신 공시 내용으로 테스트 이슈 생성)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCR + Python deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr
          pip install -r requirements.txt
      - name: Check OGE for new filings and rebuild data
        env:
          TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
          ALERT_PATH: ${{ runner.temp }}/alert.md
        run: python scripts/update.py
      # New filing → open an issue (GitHub emails the repo owner and pushes to
      # the GitHub mobile app), and push to ntfy if an NTFY_TOPIC secret is set.
      - name: Notify about new filing
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT: ${{ runner.temp }}/alert.md
          # Manual run with test_alert, or a push whose commit message has [test-alert].
          TEST_ALERT: ${{ inputs.test_alert || contains(github.event.head_commit.message, '[test-alert]') }}
        run: |
          title="🔔 트럼프 새 공시 $(date -u -d '+9 hours' +%Y-%m-%d) — 오늘 매매 확인"
          if [ "$TEST_ALERT" = "true" ]; then
            python scripts/update.py --alert-only "$ALERT"
            title="[테스트] $title"
          fi
          [ -f "$ALERT" ] || { echo "no new filing"; exit 0; }
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$ALERT" --assignee "$GITHUB_REPOSITORY_OWNER" \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$ALERT"
          if [ -n "$NTFY_TOPIC" ]; then
            curl -sS -H "Title: Trump new 278-T filing" -H "Tags: bell" \
              -H "Click: https://shinhyuk.github.io/trump/" \
              --data-binary @"$ALERT" "https://ntfy.sh/$NTFY_TOPIC"
          fi
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "data: daily update $(date -u +%Y-%m-%d)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
